; SmartKnob firmware — ESP32-S3-DevKitC-1
; Yukleme portu SABIT DEGIL (14.10): PlatformIO kendisi bulur. Port adi USB yuvasina gore
; degisiyor (usbserial-210 artik yok) ve bootloader'da native port bile ad degistiriyor
; (usbmodem9070690BBCF42 -> usbmodem21201). Sabit yazmak her seferinde bozuluyordu.
;   - CH340 UART portu takiliysa: OTOMATIK reset, BOOT+RESET gerekmez.
;   - Sadece native USB takiliysa: elle BOOT basili + RESET. ONCE 12V'U KES -- bootloader'da
;     GPIO'lar bosta, EN 3V3'e sabit oldugu icin surucu motoru rastgele surer.
; HID+CDC: native USB portundan (final knob islevi).
;
; Envler:
;   haptic      -> haptik/protokol firmware (main.cpp), HID+CDC native USB
;   bringup     -> open-loop motor testi (SimpleFOC), Serial=UART
;   as5600test  -> AS5600 sensor okuma (saf I2C), Serial=UART
;
; (Eski XIAO board: seeed_xiao_esp32s3 — gerekirse board satirini degistir.)

[common]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; --- Haptik/protokol firmware: HID+CDC (native USB portundan kullanilir) ---
[env:haptic]
extends = common
build_flags =
    -D ARDUINO_USB_MODE=0          ; TinyUSB (HID+CDC composite icin)
    -D ARDUINO_USB_CDC_ON_BOOT=1   ; CDC (Serial) native USB'de
build_src_filter = +<*> -<bringup_openloop.cpp> -<as5600_test.cpp>
; NOT: upload UART'tan (auto-reset); calisirken HID+CDC NATIVE USB portundan.
;      Serial monitor icin native USB CDC portuna bak (UART'a degil).

; --- Open-loop motor testi (Serial -> UART/CH340, auto-reset) ---
[env:bringup]
extends = common
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17                   ; SimpleFOC current-sense designated-init
    -D ARDUINO_USB_CDC_ON_BOOT=0   ; Serial -> UART0 (CH340'tan gorunur)
build_src_filter = +<bringup_openloop.cpp> +<pins.h>
lib_deps =
    askuric/Simple FOC@2.3.3       ; arduino-esp32 2.0.x uyumlu

; --- AS5600 sensor testi (saf I2C, Serial -> UART/CH340) ---
[env:as5600test]
extends = common
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0   ; Serial -> UART0 (CH340)
build_src_filter = +<as5600_test.cpp>

; --- NeoPixel 16 ring testi ---
[env:neopixeltest]
extends = common
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
build_src_filter = +<neopixel_test.cpp> +<pins.h>
lib_deps =
    fastled/FastLED@^3.6.0

; --- CLOSED-LOOP FOC + haptik (gercek sensor+motor) ---
[env:foc]
extends = common
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_MODE=0          ; TinyUSB
    -D ARDUINO_USB_CDC_ON_BOOT=1   ; native USB = composite HID + CDC (VOL senkron CDC'den, kararli)
build_src_filter = +<foc_haptic.cpp> +<MagneticSensorMT6701SSI.cpp> +<pins.h>
lib_deps =
    askuric/Simple FOC@2.3.3
    fastled/FastLED@^3.6.0
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
    adafruit/Adafruit GFX Library@^1.11.9

; --- HAPTIK AYAR TEZGAHI: centik aralagi/sertligi/sonumu elle dene (HID YOK) ---
; Uretim firmware'ine test iskelesi koymamak icin ayri. Butonlarla canli ayar,
; ekranda okunur, Mac'e hicbir sey gondermez. Detay: src/haptic_tune.cpp basligi.
[env:haptictune]
extends = common
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1   ; native USB CDC (HID YOK — sadece seri)
build_src_filter = +<haptic_tune.cpp> +<MagneticSensorMT6701SSI.cpp> +<pins.h>
lib_deps =
    askuric/Simple FOC@2.3.3
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
    adafruit/Adafruit GFX Library@^1.11.9

; --- PCF8574 (I2C1) + I2C tarama testi ---
[env:pcftest]
extends = common
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1    ; native CDC'den oku (tek native kablo baglıyken)
build_src_filter = +<pcf_test.cpp> +<pins.h>

; --- I2C tarayici + AS5600 teshis (native USB CDC'den okunur) ---
[env:i2cscan]
extends = common
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0    ; Serial -> UART/CH340 (tek kabloyla yukle+oku)
build_src_filter = +<i2c_scan.cpp> +<pins.h>

; --- TOPLU TEST: ekran + LED + motor(open-loop) + PCF (sensorsuz) ---
[env:alltest]
extends = common
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_CDC_ON_BOOT=0
build_src_filter = +<all_test.cpp> +<pins.h>
lib_deps =
    askuric/Simple FOC@2.3.3
    fastled/FastLED@^3.6.0
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
    adafruit/Adafruit GFX Library@^1.11.9

; --- ST7789 2.0" 240x320 SPI ekran testi (TFT_eSPI, pinler build_flags'te) ---
[env:tfttest]
extends = common
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0    ; Serial -> UART (tek kabloyla yukle+oku)
build_src_filter = +<tft_test.cpp>
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
    adafruit/Adafruit GFX Library@^1.11.9

; --- Ekran + LED ring BIRLIKTE testi ---
[env:tftledtest]
extends = common
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
build_src_filter = +<tft_led_test.cpp> +<pins.h>
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
    adafruit/Adafruit GFX Library@^1.11.9
    fastled/FastLED@^3.6.0

; --- GC9A01 ekran testi ---
[env:screentest]
extends = common
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
build_src_filter = +<screen_test.cpp> +<pins.h>
lib_deps =
    olikraus/U8g2@^2.35.9

; ============ KLASIK ESP32 (WROOM-32) TEST KARTI ============
; S3 yanınca gecici: sadece MOTOR + SENSOR + L6234 testi (HID/ekran/LED/buton YOK).
; DIKKAT klasik ESP32: GPIO6-11 dahili flash (KULLANMA), 34-39 input-only.
; Pinler: motor 15/16/17 (AYNI), EN 3.3V'a sabit (GPIO gerekmez), I2C sensor SDA=18 SCL=19 (5/6'dan tasindi)

[common32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200   ; dusuk hiz: gurultulu ortamda transfer kopmasin

; --- Klasik ESP32: open-loop motor testi (motor donuyor mu?) ---
[env:bringup32]
extends = common32
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D PIN_MOTOR_A=25          ; klasik ESP32 temiz pinler (6-11 FLASH! 34-39 giris-only, 12 strapping)
    -D PIN_MOTOR_B=26
    -D PIN_MOTOR_C=27
build_src_filter = +<bringup_openloop.cpp> +<pins.h>
lib_deps = askuric/Simple FOC@2.3.3

; --- Klasik ESP32: FOC + MT6701 + centik (HID yok, sadece his testi) ---
[env:foc32]
extends = common32
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D PIN_MOTOR_A=25
    -D PIN_MOTOR_B=26
    -D PIN_MOTOR_C=27
    -D PIN_I2C_SDA=21          ; klasik ESP32 standart I2C
    -D PIN_I2C_SCL=22
build_src_filter = +<foc_test32.cpp>
lib_deps = askuric/Simple FOC@2.3.3

; --- Klasik ESP32: tek tek GPIO cikis testi (multimetre ile) ---
[env:pintest32]
extends = common32
build_src_filter = +<pin_test32.cpp>

; --- Klasik ESP32: I2C tarayici (sensor hangi pinlerde?) ---
[env:i2cscan32]
extends = common32
build_src_filter = +<i2c_scan32.cpp>

; --- AYAR SURUMU: foc ile ayni ama Serial UART'ta (motor gurultusu native USB'yi bozdugu icin) ---
[env:foctune]
extends = common
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_CDC_ON_BOOT=0   ; Serial -> UART (kararli olcum)
build_src_filter = +<foc_haptic.cpp> +<MagneticSensorMT6701SSI.cpp> +<pins.h>
lib_deps =
    askuric/Simple FOC@2.3.3
    fastled/FastLED@^3.6.0
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
